apiVersion: v1
kind: Service
metadata:
  name: gpu-telemetry-api
  labels:
    {{- include "gpu.labels" . | nindent 4 }}
    app: api
spec:
  type: {{ .Values.api.serviceType }}
  ports:
    - name: http
      port: {{ .Values.api.httpPort }}
      targetPort: http
      {{- if eq .Values.api.serviceType "NodePort" }}
      nodePort: {{ .Values.api.nodePort }}
      {{- end }}
  selector:
    app: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-telemetry-api
  labels:
    {{- include "gpu.labels" . | nindent 4 }}
    app: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        {{- include "gpu.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.httpPort }}"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: api
          image: gpu-telemetry/api:{{ .Values.tag }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: HTTP_ADDR
              value: ":{{ .Values.api.httpPort }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gpu-telemetry-postgres
                  key: DATABASE_URL
          ports:
            - name: http
              containerPort: {{ .Values.api.httpPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
